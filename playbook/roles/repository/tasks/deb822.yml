  - name: install python3-debian (latest)
    apt: name=python3-debian state=latest

  - name: Install repository (with DEB822)
    ansible.builtin.deb822_repository:
      name: obs_VIFIBnexedi
      types: [deb]
      uris: "{{ url }}"
      suites: ./
      signed_by: "{{ url }}/Release.key"
      state: present
      enabled: true
    vars:
      url: "{{ base_open_build_url }}{{
        'xUbuntu_' + ansible_distribution_version
        if ansible_distribution == 'Ubuntu' else
        ansible_distribution + '_' + ansible_distribution_major_version }}"

  - name: Install Backward compatible Repository for Ubuntu 26.04
     ansible.builtin.deb822_repository:
       name: obs_VIFIBnexedi_2404
       types: [deb]
       uris: "{{ base_open_build_url }}xUbuntu_24.04"
       suites: ./
       signed_by: "{{ base_open_build_url }}xUbuntu_24.04/Release.key"
       state: present
       enabled: true
     when:
       - ansible_distribution == "Ubuntu"
       - ansible_distribution_version == "26.04"
